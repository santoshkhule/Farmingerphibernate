# =============================================================================
#  Santosh Farming ERP - Installation Configuration
#  Edit this file to connect the application to your database.
#  After editing, restart the server for changes to take effect.
# =============================================================================

# -----------------------------------------------------------------------------
# DATABASE DRIVER
# H2  (bundled, no install needed) : org.h2.Driver
# MySQL                            : com.mysql.jdbc.Driver
# PostgreSQL                       : org.postgresql.Driver
# -----------------------------------------------------------------------------
db.driver=org.h2.Driver

# -----------------------------------------------------------------------------
# DATABASE URL
# H2 file-based (default)  : jdbc:h2:file:./farmingErpDb;AUTO_SERVER=TRUE
# H2 in-memory (testing)   : jdbc:h2:mem:farmingErpDb;DB_CLOSE_DELAY=-1
# MySQL                    : jdbc:mysql://localhost:3306/farmingerpdb?useSSL=false
# PostgreSQL               : jdbc:postgresql://localhost:5432/farmingerpdb
# -----------------------------------------------------------------------------
db.url=jdbc:h2:file:./farmingErpDb;AUTO_SERVER=TRUE

# -----------------------------------------------------------------------------
# DATABASE CREDENTIALS
# -----------------------------------------------------------------------------
db.username=sa
db.password=

# -----------------------------------------------------------------------------
# HIBERNATE DIALECT
# H2        : org.hibernate.dialect.H2Dialect
# MySQL 5.x : org.hibernate.dialect.MySQL5InnoDBDialect
# MySQL 8.x : org.hibernate.dialect.MySQL8Dialect
# PostgreSQL: org.hibernate.dialect.PostgreSQLDialect
# Oracle 10g: org.hibernate.dialect.Oracle10gDialect
# Oracle 11g: org.hibernate.dialect.Oracle10gDialect
# Oracle 12c: org.hibernate.dialect.Oracle12cDialect
# -----------------------------------------------------------------------------
hibernate.dialect=org.hibernate.dialect.H2Dialect
# -----------------------------------------------------------------------------
# SCHEMA MANAGEMENT
# update  - auto-alter tables to match entities (safe for production)
# create  - drop and recreate all tables on every startup (CLEARS ALL DATA)
# validate- check schema matches entities, fail if not (safest for production)
# none    - do nothing
# -----------------------------------------------------------------------------
hibernate.hbm2ddl.auto=update

# -----------------------------------------------------------------------------
# SQL LOGGING (set true to print every SQL statement to the log)
# -----------------------------------------------------------------------------
hibernate.show_sql=false
hibernate.format_sql=false
